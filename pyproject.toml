[project]
name = "fly-in"
version = "1.0.0"
description = "Drone routing system with pathfinding and simulation"
requires-python = ">=3.10"
dependencies = [
    "arcade>=3.3.3",
    "flake8>=7.3.0",
    "mypy>=2.3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "flake8",
    "mypy",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "visualizer"
disable_error_code = ["attr-defined", "misc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
